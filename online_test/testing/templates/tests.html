{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Online Tests</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #5b5bd6;
            font-size: 32px;
            margin-bottom: 10px;
        }

        h3 {
            color: #555;
            font-weight: normal;
            margin-bottom: 30px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .test-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .test-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.4);
        }

        .test-button:active {
            transform: translateY(0);
        }

        a {
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .test-button {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Online Testing System</h1>

        <h3>Welcome, {{ username }} 👋</h3>

        <h2>Select a Test</h2>

        <div class="card">

            <a href="{% url 'python_test' %}">
                <button class="test-button">
                    🐍 Python - 3 Questions
                </button>
            </a>

            <a href="{% url 'data_science_test' %}">
                <button class="test-button">
                    📊 Data Science - 5 Questions
                </button>
            </a>

            <a href="{% url 'django_test' %}">
                <button class="test-button">
                    🌐 Django - 5 Questions
                </button>
            </a>

        </div>

    </div>

</body>

</html>
