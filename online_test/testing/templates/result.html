<!DOCTYPE html>

<html>

<head>

```
<title>Test Result</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #667eea, #764ba2);

        color: #222;
    }


    /* ===== Result Card ===== */

    .result-container {
        width: 90%;
        max-width: 600px;

        background: white;

        padding: 50px 40px;

        text-align: center;

        border-radius: 25px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }


    /* ===== Icon ===== */

    .result-icon {
        font-size: 60px;

        margin-bottom: 20px;
    }


    /* ===== Heading ===== */

    h1 {
        color: #5b5bd6;

        font-size: 30px;

        line-height: 1.4;

        margin-bottom: 25px;
    }


    /* ===== Score ===== */

    .score-box {
        background: #f3f4ff;

        border-radius: 18px;

        padding: 25px;

        margin: 20px 0;
    }

    .score-label {
        color: #666;

        font-size: 16px;

        margin-bottom: 10px;
    }

    .score {
        font-size: 42px;

        font-weight: bold;

        color: #667eea;
    }


    /* ===== Message ===== */

    .message {
        color: #666;

        font-size: 16px;

        margin-top: 20px;

        line-height: 1.6;
    }


    /* ===== Back Button ===== */

    .home-btn {
        display: inline-block;

        margin-top: 30px;

        padding: 13px 30px;

        background: linear-gradient(135deg, #667eea, #764ba2);

        color: white;

        text-decoration: none;

        border-radius: 25px;

        font-weight: bold;

        box-shadow: 0 7px 18px rgba(102, 126, 234, 0.3);

        transition: 0.3s ease;
    }

    .home-btn:hover {
        transform: translateY(-3px);

        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }


    /* ===== Mobile ===== */

    @media (max-width: 600px) {

        .result-container {
            padding: 40px 25px;
        }

        h1 {
            font-size: 25px;
        }

        .score {
            font-size: 36px;
        }

    }

</style>
```

</head>

<body>

```
<div class="result-container">

    <div class="result-icon">
        🎉
    </div>

    <h1>
        {{ username }}'s {{ subject }} Test Result
    </h1>

    <div class="score-box">

        <div class="score-label">
            Your Score
        </div>

        <div class="score">
            {{ score }} / {{ total }}
        </div>

    </div>

    <p class="message">
        Great job completing the test! Keep learning and improving your skills.
    </p>

</div>
```

</body>

</html>
