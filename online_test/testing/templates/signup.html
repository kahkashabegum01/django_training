{% load static %}

<!DOCTYPE html>

<html>

<head>

```
<title>Sign Up - Online Testing System</title>

<style>

    /* ===== General ===== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #667eea, #764ba2);

        color: #222;
    }


    /* ===== Signup Card ===== */

    .signup-container {
        width: 90%;
        max-width: 450px;

        background: white;

        padding: 45px 40px;

        border-radius: 22px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);

        text-align: center;
    }


    /* ===== Heading ===== */

    h1 {
        color: #5b5bd6;

        font-size: 30px;

        margin-bottom: 8px;
    }

    h2 {
        color: #555;

        font-size: 22px;

        margin-bottom: 30px;
    }


    /* ===== Form ===== */

    form {
        text-align: left;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;

        margin-bottom: 8px;

        font-size: 15px;

        font-weight: bold;

        color: #444;
    }

    input {
        width: 100%;

        padding: 13px 15px;

        border: 1px solid #ddd;

        border-radius: 10px;

        font-size: 15px;

        outline: none;

        transition: 0.3s ease;
    }

    input:focus {
        border-color: #667eea;

        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
    }


    /* ===== Buttons ===== */

    .button-group {
        display: flex;

        justify-content: center;

        gap: 12px;

        margin-top: 25px;
    }

    button {
        padding: 12px 28px;

        border: none;

        border-radius: 25px;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s ease;
    }

    .submit-btn {
        background: linear-gradient(135deg, #667eea, #764ba2);

        color: white;

        box-shadow: 0 6px 15px rgba(102, 126, 234, 0.3);
    }

    .clear-btn {
        background: #eeeeee;

        color: #444;
    }

    button:hover {
        transform: translateY(-3px);
    }

    .submit-btn:hover {
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .clear-btn:hover {
        background: #dddddd;
    }


    /* ===== Login Link ===== */

    .login-text {
        margin-top: 25px;

        font-size: 15px;

        color: #666;
    }

    .login-text a {
        color: #5b5bd6;

        font-weight: bold;

        text-decoration: none;
    }

    .login-text a:hover {
        text-decoration: underline;
    }


    /* ===== Mobile ===== */

    @media (max-width: 500px) {

        .signup-container {
            padding: 35px 25px;
        }

        h1 {
            font-size: 26px;
        }

        h2 {
            font-size: 20px;
        }

        .button-group {
            flex-direction: column;
        }

        button {
            width: 100%;
        }

    }

</style>
```

</head>

<body class="signup-page">

```
<div class="signup-container">

    <h1>Online Testing System</h1>

    <h2>Create Account</h2>

    <form action="{% url 'saveuser' %}" method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

        </div>


        <div class="form-group">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="button-group">

            <button type="submit" class="submit-btn">
                Submit
            </button>

            <button type="reset" class="clear-btn">
                Clear
            </button>

        </div>

    </form>
```
