<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student List</title>
  </head>
  <body>
    <h1>Student List</h1>

    <table border="1" cellpadding="10" cellspacing="0">
      <tr>
        <th>Student ID</th>
        <th>Name</th>
        <th>Branch</th>
      </tr>
      {% for student in students %}
      <tr>
        <td>{{ student.s_id }}</td>
        <td>{{ student.sname }}</td>
        <td>{{ student.sbranch }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No students added yet.</td>
      </tr>
      {% endfor %}
    </table>

    <div style="margin-top: 20px">
      <a href="{% url 'studentform' %}"
        ><button type="button">Add Another Student</button></a
      >
      <a href="{% url 'home' %}"><button type="button">Home</button></a>
    </div>
  </body>
</html>
