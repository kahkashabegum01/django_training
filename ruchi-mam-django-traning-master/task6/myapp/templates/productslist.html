<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product list</title>
  </head>
  <body>
    <div>
      <h1>product list</h1>
      <table>
        <tr>
          <th>product id</th>
          <th>product name</th>
          <th>product prize</th>
          <th>produuct offer</th>
          <th>actions</th>
        </tr>
        {% for i in products %}
        <tr>
          <td>{{i.pid}}</td>
          <td>{{i.pname}}</td>
          <td>{{i.prize}}</td>
          <td>{{i.offer}}</td>
          <td>
            <a href="{% url 'updateform' %}?id={{ i.id }}">Update</a>
            <form method="post" action="{% url 'delete' %}">
              {% csrf_token %}
              <input type="hidden" name="id" value="{{ i.id }}" />
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </table>
    </div>
  </body>
</html>
