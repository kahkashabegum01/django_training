{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Online Testing System</title>
    <link rel="stylesheet" href="{% static 'mycss.css' %}">
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>

    <div class="app-card">
        <div style="text-align: center;">
            <span class="badge-chip">
                <span class="badge-dot"></span>
                Student Registration
            </span>
        </div>

        <h2>Create Account</h2>
        <p class="subtitle" style="margin-bottom: 1.5rem;">Join now to take assessments and track your test scores.</p>

        {% if msg %}
            <div class="alert-success">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <b>{{ msg }}</b>
                </div>
                <a href="{% url 'login' %}"><button type="button" class="btn btn-primary" style="padding: 0.6rem 1.4rem; font-size: 0.92rem;">Proceed to Login →</button></a>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" name="name" class="with-icon" placeholder="e.g. John Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                        </svg>
                    </span>
                    <input type="text" name="username" class="with-icon" placeholder="Choose a unique username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" name="password" class="with-icon" placeholder="Create a strong password" required autocomplete="new-password">
                </div>
            </div>

            <div>
                <input type="submit" value="Register & Get Started">
            </div>
        </form>

        <div class="auth-switch">
            <span>Already have an account?</span>
            <a href="{% url 'login' %}"><button type="button" class="btn btn-outline">Login</button></a>
        </div>
    </div>
</body>
</html>
