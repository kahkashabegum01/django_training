{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Testing System</title>
    <link rel="stylesheet" href="{% static 'mycss.css' %}">
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>

    <div class="app-card">
        <div style="text-align: center;">
            <span class="badge-chip">
                <span class="badge-dot"></span>
                Interactive Examination Portal
            </span>
        </div>

        <h1>Online Testing System</h1>
        <p class="subtitle">Prepare, practice, and test your knowledge seamlessly with real-time feedback and intelligent evaluation.</p>

        <div class="feature-list">
            <span class="feature-pill">⚡ Instant Results</span>
            <span class="feature-pill">🎯 Multi-Topic Quizzes</span>
            <span class="feature-pill">📊 Smart Analytics</span>
        </div>

        <div class="btn-group">
            <a href="{% url 'login' %}">
                <button type="button" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    Login
                </button>
            </a>
            <a href="{% url 'signup' %}">
                <button type="button" class="btn btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    Create Account
                </button>
            </a>
        </div>
    </div>
</body>
</html>
