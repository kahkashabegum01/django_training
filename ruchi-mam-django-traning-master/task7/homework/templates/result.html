{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Report Card</title>
    <link rel="stylesheet" href="{% static 'mycss.css' %}">
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>

    <div class="app-card" style="max-width: 580px;">
        <div class="celebration-badge">
            🏆
        </div>

        <div style="text-align: center;">
            <span class="badge-chip">
                <span class="badge-dot" style="background-color: var(--success); box-shadow: 0 0 10px var(--success);"></span>
                Evaluation Complete
            </span>
        </div>

        <h2>Performance Report</h2>
        <p class="subtitle" style="margin-bottom: 1.75rem;">Here is the breakdown of your assessment results.</p>

        <div class="score-hero-box">
            <div class="score-hero-value">{{ right }} / {{ total }}</div>
            <div class="score-hero-label">Total Score Achieved</div>
        </div>

        <div class="result-stats">
            <div class="result-stat-item stat-total">
                <span class="stat-tag">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Total Questions
                </span>
                <span class="stat-val">{{ total }}</span>
            </div>

            <div class="result-stat-item stat-correct">
                <span class="stat-tag">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Correct Answers
                </span>
                <span class="stat-val">{{ right }}</span>
            </div>

            <div class="result-stat-item stat-wrong">
                <span class="stat-tag">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Wrong Answers
                </span>
                <span class="stat-val">{{ wrong }}</span>
            </div>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="{% url 'dashboard' %}">
                <button type="button" class="btn btn-primary" style="width: 100%;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Return to Dashboard
                </button>
            </a>
        </div>
    </div>
</body>
</html>
